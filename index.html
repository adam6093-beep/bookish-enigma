<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BioEngine 3D - The Sump Pump</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
        
        /* 3D Canvas Viewport */
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Top Patient Health HUD */
        #hud {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid #334155; border-radius: 12px; padding: 12px 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .hud-row { display: flex; justify-content: space-between; align-items: center; }
        .vital-tag { font-size: 13px; font-weight: 700; color: #94a3b8; }
        .vital-val { font-size: 14px; font-weight: 800; color: #38bdf8; }
        .bar-wrap { width: 100%; height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; border: 1px solid #475569; }
        #health-bar { width: 45%; height: 100%; background: #eab308; transition: width 0.3s, background 0.3s; }
        
        /* Plain English Teaching Box */
        #instruction-card {
            position: absolute; top: 95px; left: 12px; right: 12px; z-index: 10;
            background: rgba(30, 41, 59, 0.9); border-left: 4px solid #38bdf8;
            padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.4;
        }
        #instruction-card b { color: #38bdf8; }
        
        /* Bottom Control Panel & Molecule Tray */
        #bottom-panel {
            position: absolute; bottom: 16px; left: 12px; right: 12px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
        }
        .dock-status {
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; border-radius: 8px;
            padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-around;
        }
        .status-slot { font-weight: bold; }
        .tray {
            display: flex; gap: 8px; justify-content: center;
        }
        .btn-mol {
            flex: 1; padding: 12px 6px; border: none; border-radius: 10px;
            font-size: 13px; font-weight: 800; color: #fff; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s, opacity 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .btn-mol:active { transform: scale(0.95); }
        .btn-na { background: #f97316; }   /* Orange for Sodium */
        .btn-k { background: #a855f7; }    /* Purple for Potassium */
        .btn-atp { background: #eab308; }  /* Gold for Energy */
        .btn-mol span { font-size: 10px; font-weight: 500; opacity: 0.85; }
        
        /* Floating Feedback Toasts */
        #toast {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 10px 18px; border-radius: 20px; font-weight: 700; font-size: 14px;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 20;
            text-align: center; max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-row">
            <span class="vital-tag">PATIENT RESTING VOLTAGE</span>
            <span class="vital-val" id="voltage-display">-50 mV (Danger: Cell Swelling)</span>
        </div>
        <div class="bar-wrap">
            <div id="health-bar"></div>
        </div>
    </div>

    <div id="instruction-card">
        <b>Phase 1:</b> Clear out excess salt! The cell will burst if Sodium stays inside. Dock <b>3 Sodiums (Na⁺)</b> inside the pump.
    </div>

    <div id="toast"></div>

    <div id="bottom-panel">
        <div class="dock-status">
            <span class="status-slot" id="slot-na">Sodium: 0 / 3</span>
            <span class="status-slot" id="slot-k">Potassium: 0 / 2</span>
            <span class="status-slot" id="slot-atp">Energy: 0 / 1 ATP</span>
        </div>
        <div class="tray">
            <button class="btn-mol btn-na" onclick="tryDock('Na')">
                + Na⁺
                <span>Load Sodium</span>
            </button>
            <button class="btn-mol btn-atp" onclick="tryDock('ATP')">
                ⚡ ATP
                <span>Pay Energy</span>
            </button>
            <button class="btn-mol btn-k" onclick="tryDock('K')">
                + K⁺
                <span>Load Potassium</span>
            </button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. STATE MACHINE ---
        let currentPhase = 'LOAD_NA'; // Phases: LOAD_NA, FIRE_ATP, LOAD_K, RESET
        let dockedNa = 0;
        let dockedK = 0;
        let dockedATP = false;
        let membraneVoltage = -50; // Target is -70 mV
        let patientHealth = 45;

        // --- 2. THREE.JS 3D SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e17);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x38bdf8, 1.2, 50);
        pointLight.position.set(5, 5, 8);
        scene.add(pointLight);

        // Membrane Bilayer (Top & Bottom lipid plates)
        const membraneMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, transparent: true, opacity: 0.7 });
        const topMembrane = new THREE.Mesh(new THREE.BoxGeometry(16, 0.6, 6), membraneMat);
        topMembrane.position.y = 1.6;
        scene.add(topMembrane);
        const btmMembrane = new THREE.Mesh(new THREE.BoxGeometry(16, 0.6, 6), membraneMat);
        btmMembrane.position.y = -1.6;
        scene.add(btmMembrane);

        // The 3D Pump Protein Complex (Two interlocking gate lobes)
        const pumpGroup = new THREE.Group();
        const lobeMat = new THREE.MeshPhongMaterial({ color: 0x0284c7, flatShading: true });
        
        const leftLobe = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 4, 16), lobeMat);
        leftLobe.position.x = -1.3;
        pumpGroup.add(leftLobe);

        const rightLobe = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 4, 16), lobeMat);
        rightLobe.position.x = 1.3;
        pumpGroup.add(rightLobe);

        scene.add(pumpGroup);

        // Floating Ion Group for docked visuals
        const ionGroup = new THREE.Group();
        scene.add(ionGroup);

        // --- 3. GAMEPLAY & STOICHIOMETRY LOGIC ---

        function showToast(msg, bg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = bg;
            toast.style.opacity = 1;
            setTimeout(() => { toast.style.opacity = 0; }, 2000);
        }

        function updateHUD() {
            document.getElementById('slot-na').innerText = `Sodium: ${dockedNa} / 3`;
            document.getElementById('slot-k').innerText = `Potassium: ${dockedK} / 2`;
            document.getElementById('slot-atp').innerText = `Energy: ${dockedATP ? '1 / 1 Cleaved' : '0 / 1 ATP'}`;
            
            document.getElementById('voltage-display').innerText = `${membraneVoltage} mV (${membraneVoltage <= -70 ? 'Healthy Baseline' : 'Danger: Depolarized'})`;
            
            const bar = document.getElementById('health-bar');
            bar.style.width = `${patientHealth}%`;
            bar.style.background = patientHealth >= 80 ? '#22c55e' : (patientHealth >= 50 ? '#eab308' : '#ef4444');
        }

        function tryDock(type) {
            if (type === 'Na') {
                if (currentPhase !== 'LOAD_NA') {
                    showToast("Wrong step! Sodium can only dock when the pump is open to the inside.", "#ef4444");
                    return;
                }
                if (dockedNa < 3) {
                    dockedNa++;
                    spawnIonMesh(0xf97316, -1.0 + (dockedNa * 0.5), -0.8);
                    if (dockedNa === 3) {
                        currentPhase = 'FIRE_ATP';
                        document.getElementById('instruction-card').innerHTML = 
                            "<b>Phase 2:</b> 3 Sodiums are loaded! Now spend <b>1 ATP token</b> to split off energy and flip the pump open to the outside.";
                        showToast("Sodium full (3/3)! Needs ATP Energy.", "#3b82f6");
                    }
                }
            } else if (type === 'ATP') {
                if (currentPhase !== 'FIRE_ATP') {
                    showToast("The pump will not cleave ATP until all 3 Sodium slots are occupied!", "#ef4444");
                    return;
                }
                dockedATP = true;
                currentPhase = 'LOAD_K';
                
                // Animation: Flip pump conformation
                animateConformationFlip(() => {
                    clearIonMeshes();
                    document.getElementById('instruction-card').innerHTML = 
                        "<b>Phase 3:</b> The pump opened outside! 3 Sodiums flapped out. Now drag in <b>2 Potassiums (K⁺)</b> to complete the cycle.";
                    showToast("3 Na⁺ ejected outside! Load 2 K⁺", "#22c55e");
                });

            } else if (type === 'K') {
                if (currentPhase !== 'LOAD_K') {
                    showToast("Potassium cannot dock from the inside. The pump must be flipped first!", "#ef4444");
                    return;
                }
                if (dockedK < 2) {
                    dockedK++;
                    spawnIonMesh(0xa855f7, -0.6 + (dockedK * 0.6), 0.8);
                    if (dockedK === 2) {
                        completeCycle();
                    }
                }
            }
            updateHUD();
        }

        function spawnIonMesh(color, x, y) {
            const geom = new THREE.SphereGeometry(0.3, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const sphere = new THREE.Mesh(geom, mat);
            sphere.position.set(x, y, 0);
            ionGroup.add(sphere);
        }

        function clearIonMeshes() {
            while (ionGroup.children.length > 0) {
                ionGroup.remove(ionGroup.children[0]);
            }
        }

        function animateConformationFlip(onDone) {
            let frame = 0;
            function flip() {
                frame++;
                pumpGroup.rotation.z += 0.08;
                pumpGroup.scale.x = 1 - Math.sin(frame * 0.1) * 0.3;
                if (frame < 39) {
                    requestAnimationFrame(flip);
                } else {
                    pumpGroup.rotation.z = Math.PI; // Flipped upside down
                    pumpGroup.scale.x = 1;
                    if (onDone) onDone();
                }
            }
            flip();
        }

        function completeCycle() {
            showToast("Cycle Complete! Door resets inward.", "#22c55e");
            
            // Adjust patient stabilization vitals
            membraneVoltage = Math.max(-70, membraneVoltage - 10);
            patientHealth = Math.min(100, patientHealth + 30);
            
            setTimeout(() => {
                // Reset to baseline for next cycle
                pumpGroup.rotation.z = 0;
                clearIonMeshes();
                dockedNa = 0;
                dockedK = 0;
                dockedATP = false;
                currentPhase = 'LOAD_NA';
                
                if (membraneVoltage <= -70) {
                    document.getElementById('instruction-card').innerHTML = 
                        "<b>Patient Stabilized!</b> Resting membrane potential reached <b>-70 mV</b>. Cell swelling has ceased.";
                } else {
                    document.getElementById('instruction-card').innerHTML = 
                        "<b>Great Job!</b> Voltage improved, but the cell is still depolarized. Run another cycle (3 Na⁺ in) to reach -70 mV.";
                }
                updateHUD();
            }, 1200);
        }

        // --- 4. RENDER / ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            // Subtle idle floating animation for the cell environment
            const t = Date.now() * 0.001;
            pumpGroup.position.y = Math.sin(t) * 0.1;
            renderer.render(scene, camera);
        }
        animate();

        // Responsive handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateHUD();
    </script>
</body>
</html>
